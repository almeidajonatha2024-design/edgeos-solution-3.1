name: Gerador de APK EdgeOS
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Dependencias do Linux e Android
        run: |
          sudo apt update
          sudo apt install -y python3-pip zlib1g-dev libffi-dev libssl-dev xclip xsel scons autoconf automake libtool git
          pip install --upgrade pip
          pip install buildozer cython virtualenv kivy reportlab urllib3

      - name: Forçar Criação das Pastas do Android e Licenças
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n8933bad161ad4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb743130d19772421345\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # Injeção de Força Bruta: Cria a pasta e clona o motor python-for-android que deu falta no erro
          mkdir -p /home/runner/work/edgeos-solution-3.1/edgeos-solution-3.1/.buildozer/android/platform
          git clone https://github.com /home/runner/work/edgeos-solution-3.1/edgeos-solution-3.1/.buildozer/android/platform/python-for-android

      - name: Compilar APK Sem Interrupcoes
        run: |
          yes | buildozer -v android debug --allow-root
          
      - name: Liberar Download do APK Pronto
        uses: actions/upload-artifact@v4
        with:
          name: EdgeOS-Solucoes-APK
          path: bin/*.apk

