name: Gerador de APK EdgeOS
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compilar APK com Kivy-Actions
        uses: ArtemGovorov/buildozer-action@v1
        with:
          buildozer_version: stable
          command: buildozer -v android debug --allow-root
          
      - name: Liberar Download do APK Pronto
        uses: actions/upload-artifact@v4
        with:
          name: EdgeOS-Solucoes-APK
          path: .buildozer/android/platform/build-armeabi-v7a_arm64-v8a/dists/edgeossolution/bin/*.apk || bin/*.apk
